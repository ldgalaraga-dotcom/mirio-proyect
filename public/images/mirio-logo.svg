<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mirio — Aprende. Programa. Crea. Con IA.</title>
  <desc id="desc">Logotipo vectorial de Mirio con mascota robot y gorro de graduación.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3D0"/><stop offset="0.45" stop-color="#6FE7B4"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142A27"/><stop offset="1" stop-color="#061412"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE08A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Mascota -->
  <g transform="translate(800 70)" filter="url(#shadow)">
    <!-- cap -->
    <path d="M-300 125 L0 0 L300 125 L0 250 Z" fill="#071B22" stroke="url(#mint)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M-205 140 Q0 75 205 140 L175 205 Q0 155 -175 205Z" fill="#0B2526"/>
    <path d="M205 135 Q235 210 205 278" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="205" cy="286" r="18" fill="url(#gold)"/><path d="M185 300 Q205 315 225 300 L245 350 Q205 390 165 350Z" fill="url(#gold)"/>

    <!-- ears -->
    <ellipse cx="-286" cy="365" rx="68" ry="92" fill="url(#mint)" stroke="#EAF7F3" stroke-width="12"/>
    <ellipse cx="286" cy="365" rx="68" ry="92" fill="url(#mint)" stroke="#EAF7F3" stroke-width="12"/>
    <ellipse cx="-286" cy="365" rx="33" ry="53" fill="#061412" stroke="#34D399" stroke-width="9"/>
    <ellipse cx="286" cy="365" rx="33" ry="53" fill="#061412" stroke="#34D399" stroke-width="9"/>

    <!-- head -->
    <rect x="-285" y="150" width="570" height="430" rx="180" fill="#F7FAF9" stroke="#DDE9E5" stroke-width="14"/>
    <rect x="-235" y="205" width="470" height="315" rx="135" fill="#071016" stroke="#263A38" stroke-width="12"/>
    <path d="M-115 355 Q-70 300 -25 355" fill="none" stroke="#6FE7B4" stroke-width="25" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M25 355 Q70 300 115 355" fill="none" stroke="#6FE7B4" stroke-width="25" stroke-linecap="round" filter="url(#glow)"/>
    <rect x="-90" y="165" width="180" height="42" rx="21" fill="url(#mint)"/>

    <!-- body / M -->
    <path d="M-205 565 Q0 495 205 565 L260 760 Q0 875 -260 760Z" fill="url(#dark)" stroke="url(#mint)" stroke-width="14"/>
    <path d="M-170 585 L0 720 L170 585 L205 700 L0 835 L-205 700Z" fill="url(#mint)"/>
    <path d="M-118 640 L0 735 L118 640 L98 700 L0 780 L-98 700Z" fill="#0A1D19"/>
    <!-- hands -->
    <ellipse cx="-205" cy="600" rx="55" ry="42" fill="#F7FAF9" transform="rotate(28 -205 600)"/>
    <ellipse cx="205" cy="600" rx="55" ry="42" fill="#F7FAF9" transform="rotate(-28 205 600)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(800 930)">
    <text x="0" y="0" text-anchor="middle" font-family="Poppins, Inter, Arial, sans-serif" font-size="205" font-weight="800" letter-spacing="-10" fill="#F7FAF9">Mirio</text>
    <circle cx="-57" cy="-150" r="23" fill="url(#mint)"/>
    <path d="M-390 48 H390" stroke="url(#mint)" stroke-width="12" stroke-linecap="round"/>
    <rect x="-390" y="75" width="780" height="95" rx="48" fill="#0B2520" stroke="#34D399" stroke-width="6"/>
    <text x="0" y="139" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="600" fill="#F7FAF9">Aprende. Programa. Crea. <tspan fill="#6FE7B4">Con IA.</tspan></text>
  </g>
</svg>
